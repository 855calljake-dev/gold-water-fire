name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install system dependencies (image/OCR tooling for worker/imageTextGate)
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl imagemagick tesseract-ocr tesseract-ocr-eng

      - run: npm ci

      - run: npm run build

      - run: npm test
