# Gold Water Fire — static site. No framework; the build step is a plain Node
# script (scripts/build.mjs) that renders content/pages/*.json through the
# shared template in templates/. See SOP-AGENTIC-SEO-WEBSITES.md.

[build]
  command = "npm run build"
  publish = "."
  # Skip the paid production deploy when a commit touches only internal files
  # (worker code, backlog, docs, CI, tests). Fail-safe: anything else builds.
  # After a skipped commit the plain "Deploy site" button is skipped too; use
  # "Clear cache and deploy site" or a build hook to force a deploy.
  # See scripts/netlify-ignore.sh and bytomorrow-bos doctrine/HANDOFF-NETLIFY-DEPLOY-REDUCTION.md.
  ignore = "bash ./scripts/netlify-ignore.sh"

# One URL form, .html (Jake, 2026-10-03, SEO audit fix 1). Netlify's Pretty
# URLs post-processing rewrote every href="/x.html" to href='/x' after the
# build, so internal links said extensionless while the canonical tag, og:url,
# sitemap, llms.txt and IndexNow all say .html. Set here rather than in the UI
# so the choice is versioned; this key overrides the UI toggle. Both /x.html
# and /x still resolve; no redirect between them is added.
[build.processing.html]
  pretty_urls = false

# Images are overwritten in place under a stable, slug-based filename, so new
# bytes arrive at an unchanged URL. Under the previous rule (max-age=604800,
# no revalidation) a replaced image stayed invisible to anyone who had loaded
# the page in the past week, which is how a corrected image can look uncorrected.
# max-age keeps the fast path for an hour; stale-while-revalidate then serves
# the cached copy instantly for up to a week while fetching the new one in the
# background, so freshness costs no visible latency. Real fix is content-hashed
# filenames, which needs a worker change; this is the one-line mitigation.
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=604800"

# Team roster JSON drives the About page — must never cache stale
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# goldwaterroof.com is the roofing domain. Every host and scheme sends the
# visitor to the roofing page in ONE hop, the pattern bytomorrow-bos set for
# ADL (HANDOFF-ADL-LIFT-VA-CONTENT.md A4). These only fire once the domain is
# added to this Netlify site as a domain alias and GoDaddy DNS points here;
# until then they are inert. Paths are dropped on purpose: the roofing domain
# has no pages of its own.
[[redirects]]
  from = "https://goldwaterroof.com/*"
  to = "https://www.goldwaterfire.com/roof/"
  status = 301
  force = true

[[redirects]]
  from = "https://www.goldwaterroof.com/*"
  to = "https://www.goldwaterfire.com/roof/"
  status = 301
  force = true

[[redirects]]
  from = "http://goldwaterroof.com/*"
  to = "https://www.goldwaterfire.com/roof/"
  status = 301
  force = true

[[redirects]]
  from = "http://www.goldwaterroof.com/*"
  to = "https://www.goldwaterfire.com/roof/"
  status = 301
  force = true

# Guides merged into an owner page (SEO audit fixes 5, 6, 7, approved by Jake
# 2026-10-03). The impact and redirect plan is in gwf-bos
# doctrine/evidence/2026-10-03-seo-audit-fixes/. One rule per URL form so both
# /x.html and /x reach the owner in one hop. force = true makes the rule win
# even if a stale file is ever left at the old path.
[[redirects]]
  from = "/guides/which-insulation-survives-getting-wet.html"
  to = "/guides/insulation-replacement-after-water-damage.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/which-insulation-survives-getting-wet"
  to = "/guides/insulation-replacement-after-water-damage.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/why-drying-takes-days-not-hours.html"
  to = "/guides/what-is-structural-drying.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/why-drying-takes-days-not-hours"
  to = "/guides/what-is-structural-drying.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/hvac-system-after-a-fire.html"
  to = "/guides/hvac-replacement-after-fire.html"
  status = 301
  force = true

[[redirects]]
  from = "/guides/hvac-system-after-a-fire"
  to = "/guides/hvac-replacement-after-fire.html"
  status = 301
  force = true

# Publish dir is "." so repo-root docs would otherwise be served to the public.
# CLAIMS-TO-VERIFY.md in particular must never be public — it's an internal
# gate on unverified claims (certifications, testimonials, team photos).
# admin/config.yml stays readable on purpose — Decap needs to fetch it.
# force = true is required: without it Netlify serves the real file and
# skips the rule, because a static file at that path wins by default.
[[redirects]]
  from = "/README.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CLAIMS-TO-VERIFY.md"
  to = "/"
  status = 404
  force = true

# Source directories for the template pipeline — not secrets (the repo is
# public anyway), just no reason to serve them on the live domain.
[[redirects]]
  from = "/content/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/templates/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/worker/*"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/package.json"
  to = "/"
  status = 404
  force = true

# Railway build config for the content worker. Nothing on the site reads it,
# and scripts/netlify-ignore.sh treats it as internal, so it must not be served.
[[redirects]]
  from = "/nixpacks.toml"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/AGENTS.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/CLAUDE.md"
  to = "/"
  status = 404
  force = true

[[redirects]]
  from = "/IMAGERY-REFERENCES.md"
  to = "/"
  status = 404
  force = true

# Function and library source. Netlify bundles netlify/functions itself; the
# raw files under /netlify/ must not be served as static pages. Not secrets
# (the repo is public), just no reason to serve them.
[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 404
  force = true
