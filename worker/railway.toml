# Railway config for the Gold Water Fire content-drafting worker.
# Point this service's "Config as code" path at this file.
#
# Mirrors bytomorrow-platform's agent-runtime service (doctrine/AGENT-RUNTIME.md):
# dry by default, live is opt-in, the process must exit or every subsequent
# scheduled run is silently skipped.
#
# Schedule is UTC. 0 9 * * * = 2 AM Phoenix year-round (Arizona doesn't
# observe DST). RUNTIME_MODE defaults to "dry" as an env var on the service —
# the cron firing on schedule does NOT mean it publishes anything. A human
# sets RUNTIME_MODE=live deliberately; nothing here does that automatically.

[build]
builder = "nixpacks"
buildCommand = "echo 'gwf-content-worker: no build step'"

[deploy]
startCommand = "npm run worker"
cronSchedule = "0 9 * * *"
restartPolicyType = "never"
