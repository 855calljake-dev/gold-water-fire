# Build config for the gwf-content-worker Railway service (.railway/railway.ts,
# builder: NIXPACKS). Nothing else in this repo uses it -- the site itself is
# static and deploys on Netlify, which ignores this file entirely.
#
# Why it exists: SOP-AGENTIC-SEO-WEBSITES.md §8.3.1 requires every generated
# image to carry embedded IPTC/XMP/EXIF metadata, and worker/image.mjs does
# that by shelling out to the `exiftool` CLI (a system binary, not an npm
# dependency -- same "plain script, no SDK" reasoning §8.1 gives for calling
# Higgsfield through fetch()). Nixpacks' Node provider image has no exiftool,
# so without this the metadata step would fail soft on every single real run:
# images ship, pages ship, nothing errors, and none of it is tagged. That is
# exactly the deploy gap §8.3.1 flagged as open.
#
# `libimage-exiftool-perl` is the Debian package that provides /usr/bin/exiftool.
#
# The leading "..." is required, not stylistic: without it this array REPLACES
# the provider's own apt packages instead of extending them
# (nixpacks.com/docs/configuration/file).
#
# `imagemagick` is the second one, added 2026-08-11 (Jake: "let's make the
# images lighter"). Higgsfield returns ~1.9MB PNGs; the site's own images are
# 1600px JPEGs at ~270KB, so worker output shipped ~7x heavier than the house
# convention. worker/image.mjs converts before tagging, and fails soft the
# same way, so a host without it ships heavy rather than shipping nothing.
# Note Ubuntu's package is ImageMagick 6, whose binary is `convert`, not
# `magick` -- image.mjs tries both.
#
# `tesseract-ocr` and `tesseract-ocr-eng` are the third and fourth, added
# 2026-08-26 for the SOP-AGENTIC-SEO-WEBSITES.md §8.3.2 image text gate
# (worker/imageTextGate.mjs). This one is NOT like the two above it: it fails
# HARD. A host without tesseract rejects every generated image unchecked, and
# §8.5 then drops every page, so the batch comes back empty rather than coming
# back untagged. worker/run.mjs probes for it in its first log line, because
# that outcome is otherwise indistinguishable from a quiet night.
#
# BOTH packages are named on purpose. `tesseract-ocr` does not pull the English
# trained data through apt Recommends reliably, and without `tesseract-ocr-eng`
# the binary installs, reports a version, runs, and then errors on every single
# image. Under a hard-fail gate that is a silent total stop. Found on
# jaketaylor-home-loans the same day the gate shipped there; do not "simplify"
# this back to one package.
[phases.setup]
aptPkgs = ["...", "libimage-exiftool-perl", "imagemagick", "tesseract-ocr", "tesseract-ocr-eng"]
